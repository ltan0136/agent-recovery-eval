[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-recovery-eval"
version = "0.2.0"
description = "Reproducible multi-workflow tool execution, recovery and regression evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
mcp = ["mcp==2.0.0"]
modal = ["modal==1.6.2"]

[project.scripts]
recovery-eval = "recovery_eval.cli:main"

[tool.setuptools.packages.find]
include = ["recovery_eval*"]
