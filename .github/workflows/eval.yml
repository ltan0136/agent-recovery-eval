name: evaluation-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: recovery-eval run --variants 2 --seeds 1 --out runs/ci
      - name: Check unchanged baseline
        run: |
          recovery-eval compare --before runs/ci/episodes.jsonl --after runs/ci/episodes.jsonl --before-agent idempotent_retry --after-agent idempotent_retry --out runs/unchanged.json
          python -c "import json; assert json.load(open('runs/unchanged.json'))['decision']=='pass'"
      - name: Detect intentional regression
        run: |
          set +e
          recovery-eval compare --before runs/ci/episodes.jsonl --after runs/ci/episodes.jsonl --before-agent idempotent_retry --after-agent bounded_retry --out runs/regression.json --fail-on-block
          code=$?
          test "$code" -eq 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-${{ matrix.python-version }}
          path: runs/
  optional-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install '.[mcp,modal]' ./integrations/prime_taskset
      - run: python -m unittest discover -s tests -p test_mcp_v2.py -v
      - run: python -m unittest discover -s integrations/prime_taskset/tests -v
      - name: Validate optional SDKs without cloud calls
        run: |
          python -c "from recovery_diagnosis import load_environment; assert list(load_environment().load())"
          python -c "import modal_eval; from recovery_eval.workflows import build_matrix; rows=modal_eval.evaluate_batch.local([{'case': c, 'policy':'idempotent_retry'} for c in build_matrix(variants=1,seeds=1,faults='clean')]); assert len(rows)==4 and all(r['success'] for r in rows)"
