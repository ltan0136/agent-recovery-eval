[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recovery-diagnosis"
version = "0.2.0"
description = "Settled-state and ledger diagnosis tasks for Recovery Eval v0.2 and Verifiers v1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["verifiers==0.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["recovery_diagnosis"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "recovery_diagnosis/data"

[tool.hatch.build.targets.sdist]
include = ["recovery_diagnosis", "data", "tests", "scripts", "README.md", "pyproject.toml"]
